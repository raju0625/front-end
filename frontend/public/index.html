<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <h1>Login</h1>
    <form id="loginForm" class="card">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" required />

      <button type="submit">Sign in</button>
      <p id="msg" class="msg"></p>
    </form>

    <details class="card" style="margin-top:16px;">
      <summary>Create account (for testing)</summary>
      <form id="registerForm">
        <label for="regEmail">Email</label>
        <input id="regEmail" name="email" type="email" placeholder="new@example.com" required />

        <label for="regPassword">Password</label>
        <input id="regPassword" name="password" type="password" placeholder="Choose a password" required />

        <button type="submit">Register</button>
        <p id="regMsg" class="msg"></p>
      </form>
    </details>
  </div>
  <script src="/app.js" defer></script>
  <noscript>Please enable JavaScript to use this app.</noscript>
  
</body>
</html>
